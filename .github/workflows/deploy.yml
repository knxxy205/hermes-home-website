name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v6

      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: |
            index.html
            styles.css
            script.js
            .nojekyll
            asset/hermes-home-logo.png
            asset/mockup-files.png
            asset/mockup-login.png
            asset/mockup-terminal.png
            asset/Screenshot_20261103-185533.jpg

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
